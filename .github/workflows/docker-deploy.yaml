name: Build, Scan, Sign, Push, Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # for OIDC (cosign signing or cloud auth)
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build and push image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/pidonos:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/pidonos:latest
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache

    - name: Generate SBOM (syft)
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
        syft ghcr.io/${{ github.repository_owner }}/pidonos:${{ github.sha }} -o spdx-json > sbom-${{ github.sha }}.spdx.json
    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom-${{ github.sha }}.spdx.json

    - name: Scan image (Trivy)
      uses: aquasecurity/trivy-action@v1
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/pidonos:${{ github.sha }}

    - name: Sign image with cosign (OIDC)
      uses: sigstore/cosign-installer@v2
    - name: cosign sign (OIDC)
      run: |
        cosign sign --oidc-token $ACTIONS_ID_TOKEN --keyless ghcr.io/${{ github.repository_owner }}/pidonos:${{ github.sha }}
      env:
        ACTIONS_ID_TOKEN: ${{ steps.generate_oidc_token.outputs.token || '' }}

    - name: Deploy to Kubernetes (optional, use KUBECONFIG secret)
      if: github.ref == 'refs/heads/main'
      uses: azure/k8s-deploy@v4
      with:
        manifests: |
          k8s/deployment.yaml
          k8s/service.yaml
          k8s/hpa.yaml
        images: |
          ghcr.io/${{ github.repository_owner }}/pidonos:${{ github.sha }}
      env:
        KUBECONFIG: ${{ secrets.KUBECONFIG }}
