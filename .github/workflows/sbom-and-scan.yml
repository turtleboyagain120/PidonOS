# SBOM generation and vulnerability scanning workflow
# Purpose: generate SBOM(s), run Trivy/Grype scans, produce signed SBOM artifacts,
# and create a human-readable HTML summary. Designed to be used on-demand or on main.
# Location: .github/workspace/sbom-and-scan.yml
#
# Characteristics:
# - Uses syft (SBOM), trivy (vuln scan), and cosign for signing SBOM(s).
# - Does not embed secrets. If you want signed SBOM storage to an external registry,
#   configure secrets in GitHub and adapt the "publish" steps accordingly.
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
name: "PidonOS SBOM & Scan (turtleboyagain120/PidonOS)"

permissions:
  contents: read
  id-token: write

env:
  REPO: turtleboyagain120/PidonOS
  IMAGE_PLACEHOLDER: ghcr.io/turtleboyagain120/pidonos:latest

jobs:
  build-sbom:
    name: Generate SBOM(s) for filesystem and (optionally) container image
    runs-on: ubuntu-latest
    outputs:
      sbom-file: ${{ steps.syft.outputs.sbom_path || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install syft (for SBOM generation)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version || true

      - name: Generate filesystem SBOM (repo source)
        id: syft
        run: |
          # Generate SPDX JSON SBOM for the repository contents
          syft dir:. -o spdx-json > sbom-repo-spdx.json || true
          # Also generate CycloneDX (useful for many tools)
          syft dir:. -o cyclonedx > sbom-repo-cyclonedx.xml || true
          echo "::set-output name=sbom_path::sbom-repo-spdx.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-repo
          path: |
            sbom-repo-spdx.json
            sbom-repo-cyclonedx.xml

      - name: Attempt container-image SBOM (if image present in GHCR)
        # This step is conservative: it will not fail the job if the image isn't published.
        run: |
          # Use syft to inspect a container in GHCR under known owner (may fail if image doesn't exist)
          echo "Inspecting image: ${IMAGE_PLACEHOLDER}"
          syft ${IMAGE_PLACEHOLDER} -o spdx-json > sbom-image-spdx.json || true
          syft ${IMAGE_PLACEHOLDER} -o cyclonedx > sbom-image-cyclonedx.xml || true
      - name: Upload image SBOMs (if any)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-image
          path: |
            sbom-image-spdx.json
            sbom-image-cyclonedx.xml

  vuln-scan:
    name: Vulnerability scanning of SBOMs and image (Trivy + Grype)
    runs-on: ubuntu-latest
    needs: build-sbom
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy (scanner)
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version || true

      - name: Scan repository SBOM with Trivy (SBOM scan mode)
        run: |
          # If sbom-repo-spdx.json exists, run trivy sbom scan.
          if [ -f sbom-repo-spdx.json ]; then
            trivy sbom --format json --output trivy-sbom-repo.json sbom-repo-spdx.json || true
            jq -r '.Results[]?.Vulnerabilities | length' trivy-sbom-repo.json || true
          else
            echo "No repo SBOM found; skipping sbom scan"
          fi

      - name: Scan known GHCR image with Trivy (image scanning)
        run: |
          # Scans the concrete image reference if it exists; will attempt to pull from ghcr.io
          IMAGE_REF=ghcr.io/turtleboyagain120/pidonos:latest
          trivy image --format json --output trivy-image-latest.json ${IMAGE_REF} || true
      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-sbom-repo.json
            trivy-image-latest.json

  sbom-sign-and-summary:
    name: Sign SBOM and create human-readable summary
    runs-on: ubuntu-latest
    needs: [ build-sbom, vuln-scan ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v2

      - name: (Optional) Sign SBOM using cosign (keyless via OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Keyless signing of the repository SBOM artifact (if present)
          if [ -f sbom-repo-spdx.json ]; then
            echo "Signing sbom-repo-spdx.json with cosign (keyless)"
            cosign sign-blob --keyless sbom-repo-spdx.json || true
          else
            echo "No sbom-repo-spdx.json found; skipping cosign"
          fi

      - name: Produce an HTML summary of findings
        run: |
          cat > sbom-summary.html <<'HTML'
          <html><head><meta charset="utf-8"><title>PidonOS SBOM Summary</title></head><body>
          <h1>PidonOS SBOM & Vulnerability Summary</h1>
          <p>Repository: turtleboyagain120/PidonOS</p>
          <h2>Notes</h2>
          <ul>
            <li>SBOM(s) generated for filesystem and attempted image inspection of ghcr.io/turtleboyagain120/pidonos:latest</li>
            <li>Trivy scan outputs are attached as artifacts in the workflow run</li>
          </ul>
          </body></html>
          HTML
      - name: Upload summary and signed SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-signed-summary
          path: |
            sbom-summary.html
            sbom-repo-spdx.json
            sbom-image-spdx.json
